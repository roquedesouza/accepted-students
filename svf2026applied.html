<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVF Applied 2026 - Accepted Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f6f9; --surface:#fff; --text:#0f172a; --muted:#64748b; --primary:#2563eb; --border:#e2e8f0; --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04); --radius:14px; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;display:flex;flex-direction:column}
    .page{max-width:720px;margin:0 auto;padding:40px 20px 48px;flex:1;width:100%}
    .back{display:inline-flex;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:24px}
    .back:hover{color:var(--primary)}
    h1{font-size:clamp(24px,4vw,30px);font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
    .meta{color:var(--muted);font-size:14px;margin-bottom:28px}
    .list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .student{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--border);font-size:15px}
    .student:last-child{border-bottom:none}
    .student-name{font-weight:500}
    .linkedin{flex-shrink:0;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;padding:6px 12px;border-radius:8px;background:#eff6ff}
    .linkedin:hover{background:#dbeafe}
    footer{background:#0f1115;color:#94a3b8;text-align:center;padding:32px 20px;font-size:14px;margin-top:auto}
    footer a{color:#5eead4;text-decoration:underline;text-underline-offset:3px;font-weight:500}
    footer a:hover{color:#99f6e4}
    footer .tagline{margin-top:8px;font-size:13px;color:#64748b}
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">← Back to Programs</a>
    <h1>SVF Applied 2026</h1>
    <p class="meta">Accepted Students</p>
    <div class="list">
      <div class="student"><span class="student-name">Roque Desouza</span><a class="linkedin" href="https://www.linkedin.com/in/roque-desouza" target="_blank" rel="noopener">LinkedIn</a></div>
    </div>
  </div>
  <footer>
    <p>&copy; 2026 <a href="https://visualixe-foundation.vercel.app/" target="_blank" rel="noopener">Visualixe Foundation</a>. All rights reserved.</p>
    <p class="tagline">Built with purpose</p>
  </footer>
</body>
</html>
